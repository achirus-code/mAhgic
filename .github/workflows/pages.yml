name: Website

# Publishes website/ to GitHub Pages. The app zip is not in git; it is taken
# from the latest release so the Download button works on the public site.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch app zip from latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p website/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'mAhgic-*.zip' --dir website/downloads
          ls -la website/downloads

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
